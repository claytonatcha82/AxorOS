name: Manual Atlas Cloud Ingestion

on:
  workflow_dispatch:
    inputs:
      atlas_repository:
        description: Private Atlas mirror repository in owner/name form
        required: true
        type: string
      atlas_ref:
        description: Atlas mirror branch, tag, or commit
        required: true
        default: main
        type: string
      knowledge_release:
        description: Knowledge release label recorded in ingestion provenance
        required: true
        default: pilot-dev
        type: string

permissions:
  contents: read

concurrency:
  group: atlas-cloud-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest Atlas into PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout AxorOS
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install AxorOS dependencies
        run: npm ci

      - name: Checkout private Atlas mirror
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.atlas_repository }}
          ref: ${{ inputs.atlas_ref }}
          ssh-key: ${{ secrets.ATLAS_DEPLOY_KEY }}
          path: .atlas-source
          persist-credentials: false

      - name: Install Infisical CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get update
          sudo apt-get install -y infisical
          infisical --version

      - name: Authenticate Infisical Universal Auth
        shell: bash
        env:
          INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_DISABLE_UPDATE_CHECK: 'true'
        run: |
          set -euo pipefail
          test -n "$INFISICAL_UNIVERSAL_AUTH_CLIENT_ID" || { echo 'FAIL  INFISICAL_CLIENT_ID is missing'; exit 1; }
          test -n "$INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET" || { echo 'FAIL  INFISICAL_CLIENT_SECRET is missing'; exit 1; }
          TOKEN="$(infisical login --method=universal-auth --silent --plain)"
          test -n "$TOKEN" || { echo 'FAIL  Infisical Universal Auth returned no access token'; exit 1; }
          echo "::add-mask::$TOKEN"
          echo "INFISICAL_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo 'PASS  Infisical Universal Auth'

      - name: Validate Atlas mirror
        shell: bash
        run: |
          set -euo pipefail
          test -d "$GITHUB_WORKSPACE/.atlas-source" || { echo 'FAIL  Atlas mirror checkout is missing'; exit 1; }
          echo 'PASS  Atlas mirror checkout'

      - name: Build AxorOS API
        run: npm run build --workspace @axoros/api

      - name: Ingest Atlas mirror
        shell: bash
        env:
          AXOROS_ATLAS_ROOT: ${{ github.workspace }}/.atlas-source
          AXOROS_KNOWLEDGE_RELEASE: ${{ inputs.knowledge_release }}
          INFISICAL_DISABLE_UPDATE_CHECK: 'true'
        run: |
          set -euo pipefail
          export AXOROS_ATLAS_SOURCE_COMMIT="$(git -C "$AXOROS_ATLAS_ROOT" rev-parse HEAD)"
          echo "INFO  Atlas source commit: $AXOROS_ATLAS_SOURCE_COMMIT"
          echo "INFO  Knowledge release: $AXOROS_KNOWLEDGE_RELEASE"
          infisical run --projectId=79dae67a-8cd4-4536-94bf-dda02dcb82d1 --env=dev --path=/api -- node scripts/ingest-atlas.mjs
